owner: amanothai
repo: amanosolution-status

sites:
  - name: Parking Web (SIT)
    url: https://sit.amanosolution.com/health
  - name: Parking API (SIT)
    url: https://sit-api.amanosolution.com/api/health
  - name: Release CDN
    url: https://releases.amanosolution.com/health.txt

status-website:
  cname: status.amanosolution.com
  name: Amano Parking System
  introTitle: Amano Parking System Status
  introMessage: >-
    Live availability of the Amano Parking System platform.


    **A note on response times.** These checks run from GitHub Actions runners in
    the US against servers in AWS ap-southeast-7 (Bangkok). Each figure therefore
    includes roughly 700-900 ms of trans-Pacific round trips and TLS handshake,
    paid fresh on every check because no connection is reused. It is a measure of
    distance, not of application speed. From within South East Asia the same
    request typically completes in 5-80 ms, and server-side processing is under
    10 ms. Read these graphs for availability and for trends over time, not as
    absolute latency.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/amanothai/amanosolution-status

# Checks run from GitHub, outside AWS, so an ap-southeast-7 outage
# does not take the status page down with it.
workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updates: "0 3 * * *"
  updateTemplate: "0 0 * * 0"
  uptime: "*/5 * * * *"

i18n:
  activeIncidents: Active incidents
  allSystemsOperational: All systems operational
