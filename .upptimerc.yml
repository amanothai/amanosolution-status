owner: amanothai
repo: amanosolution-status

sites:
  - name: Parking Web (SIT)
    url: https://sit.amanosolution.com/health
  - name: Parking API (SIT)
    url: https://sit-api.amanosolution.com/api/health
  - name: Release CDN
    url: https://releases.amanosolution.com/health.txt

status-website:
  cname: status.amanosolution.com
  name: Amano LPR Parking
  introTitle: Amano LPR Parking Status
  introMessage: Live availability of the Amano LPR Parking platform.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/amanothai/amanosolution-status

# Checks run from GitHub, outside AWS, so an ap-southeast-7 outage
# does not take the status page down with it.
workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updates: "0 3 * * *"
  updateTemplate: "0 0 * * 0"
  uptime: "*/5 * * * *"

i18n:
  activeIncidents: Active incidents
  allSystemsOperational: All systems operational
